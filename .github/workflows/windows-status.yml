name: Read Windows workflow status
on:
  push:
    branches: [windows-build-prototype]
    paths: ['.github/workflows/windows-status.yml']
permissions:
  actions: read
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: windows-build-prototype
      - name: Save status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci-status
          gh run list --repo "$GITHUB_REPOSITORY" --workflow windows-atl-probe.yml --branch windows-build-prototype --limit 1 --json databaseId,status,conclusion,headSha > ci-status/latest-atl-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-status/latest-atl-run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record latest ATL run status'
          git push origin HEAD:windows-build-prototype
